
name: Run Data Pipeline Automation

on:
  schedule:
    - cron: "30 3 * * *"    # 9:00 AM IST
    - cron: "30 6 * * *"    # 12:00 PM IST
    - cron: "30 9 * * *"    # 3:00 PM IST
    - cron: "30 12 * * *"   # 6:00 PM IST
    - cron: "30 15 * * *"   # 9:00 PM IST

  workflow_dispatch:

concurrency:
  group: data-pipeline-automation
  cancel-in-progress: false

jobs:
  run-data-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version

      - name: Execute Data_Pipeline_Automation.py
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

        run: |
          echo "=============================="
          echo "Workflow triggered at UTC: $(date -u)"
          echo "Current branch: $GITHUB_REF"
          echo "Repository path: $GITHUB_WORKSPACE"
          echo "=============================="

          echo "Starting Data_Pipeline_Automation.py..."

          python Data_Pipeline_Automation.py

          echo "Data_Pipeline_Automation.py executed successfully."
